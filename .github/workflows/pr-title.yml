name: PR Title

on:
  pull_request:
    types: [opened, edited]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|chore)(\(.*\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "PR 标题须符合 Conventional Commits：类型: 中文主题（feat/fix/docs/refactor/perf/test/chore）"
            exit 1
          fi
