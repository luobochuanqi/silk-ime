name: 功能建议
description: 提出新功能或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述真实的使用场景或痛点
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 期望的实现方式或交互体验
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 考虑过的其他方案及其不足
